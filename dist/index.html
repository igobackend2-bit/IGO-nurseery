<body class="bg-white text-igo-dark">
    <script>
      // Only log to backend in local dev; in production, fall back to console only
      var LOG_ENDPOINT = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
        ? '/api/log'
        : null;
      window.onerror = function(message, source, lineno, colno, error) {
        if (LOG_ENDPOINT) {
          fetch(LOG_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ error: message, stack: error ? error.stack : '' })
          }).catch(() => console.error(message));
        } else {
          console.error('[Error]', message, error ? error.stack : '');
        }
      };
      window.addEventListener('unhandledrejection', function(event) {
        if (LOG_ENDPOINT) {
          fetch(LOG_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ error: event.reason ? event.reason.message : 'Unhandled Rejection', stack: event.reason ? event.reason.stack : '' })
          }).catch(() => console.error(event.reason));
        } else {
          console.error('[Unhandled Rejection]', event.reason);
        }
      });
    </script>
